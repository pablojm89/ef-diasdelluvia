name: Publicar El Pabellón
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revisar contenido público
        run: node scripts/check-public-content.mjs
      - run: npm test
      - name: Comprobar origen de publicación de Pages
        id: pages-mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          echo "build_type=$build_type" >> "$GITHUB_OUTPUT"
          if [ "$build_type" = "legacy" ]; then
            echo "Pages publica desde la rama configurada. Este workflow verifica el contenido; no cambia esa configuración."
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages-mode.outputs.build_type == 'workflow'
      - name: Preparar archivos públicos
        if: steps.pages-mode.outputs.build_type == 'workflow'
        run: |
          mkdir -p _site/assets
          cp index.html hub.css hub.js registro.js notas.js patio.html app.js content.js engine.js styles.css _site/
          cp assets/*.svg assets/*.webp _site/assets/
          cp -R mate _site/mate
          cp -R comun _site/comun
          cp -R gimnasio _site/gimnasio
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages-mode.outputs.build_type == 'workflow'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: steps.pages-mode.outputs.build_type == 'workflow'
        id: deployment
