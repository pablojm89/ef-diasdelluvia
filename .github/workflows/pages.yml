name: Publicar Patio Interior y Mate Arena
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revisar contenido público
        run: node scripts/check-public-content.mjs
      - run: npm test
      - name: Usar publicación de Pages por GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$build_type" != "workflow" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow > /dev/null
          fi
      - uses: actions/configure-pages@v5
      - name: Preparar archivos públicos
        run: |
          mkdir -p _site/assets
          cp index.html app.js content.js engine.js styles.css _site/
          cp assets/*.svg assets/*.webp _site/assets/
          cp -R mate _site/mate
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
